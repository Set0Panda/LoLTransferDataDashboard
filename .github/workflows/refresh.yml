name: Refresh radar (full)
on:
  schedule: [{cron: "7 */3 * * *"}]   # every 3 hours: YouTube search costs ~500 quota units a run (free limit 10,000/day)

  workflow_dispatch:
    inputs:
      force:
        description: 'Accept a large per-region change in the contract data that the guard would otherwise block'
        type: boolean
        default: false
permissions: {contents: write}
concurrency: {group: radar-refresh, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v5
        with: {node-version: 24}
      - name: Contract data, straight from Riot's sheet (same script and guard as Contract Radar)
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.force && '1' || '0' }}
        run: |
          # logos, KR roles and region data are static assets maintained in Contract Radar
          for f in logos.js roles-kr.js regions.js; do
            curl -fsSL "https://set0panda.github.io/contract-radar/$f" -o "docs/contract/$f.new" && mv "docs/contract/$f.new" "docs/contract/$f" || { rm -f "docs/contract/$f.new"; echo "::warning::fetch failed for $f, keeping existing"; }
          done
          rc=0; node scripts/contract_refresh.js --out docs/contract > /tmp/cr.txt 2>&1 || rc=$?
          cat /tmp/cr.txt; cat /tmp/cr.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::warning::direct sheet refresh did not publish (sanity check blocked it or the sheet was unreachable); data.js and history.js stay as they were. Re-run with 'force' if the change is real."
            if ! grep -q "SANITY CHECK FAILED" /tmp/cr.txt; then
              # sheet unreachable (not a guard block): fall back to Contract Radar's published copy, behind the same kind of guard
              for f in data.js history.js; do curl -fsSL "https://set0panda.github.io/contract-radar/$f" -o "docs/contract/$f.new" || rm -f "docs/contract/$f.new"; done
              if [ -f docs/contract/data.js.new ] && python scripts/guard_contract.py docs/contract/data.js docs/contract/data.js.new; then
                mv docs/contract/data.js.new docs/contract/data.js; [ -f docs/contract/history.js.new ] && mv docs/contract/history.js.new docs/contract/history.js
              fi
              rm -f docs/contract/*.new
            fi
          fi
      - name: LCK/LPL coaches from Leaguepedia (skips itself until the bot secrets exist; never blocks the refresh)
        continue-on-error: true
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASS: ${{ secrets.LEAGUEPEDIA_PASS }}
        run: python scripts/coach_sync.py
      - run: python radar.py run
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          python scripts/bump_assets.py
          git add data/radar.db docs/data.js docs/contract docs/coaches-extra.js docs/index.html
          git diff --cached --quiet || (git commit -m "Refresh data" && git pull --rebase -X theirs origin main && git push)
