name: Refresh radar (full)
on:
  schedule: [{cron: "7 */3 * * *"}]   # every 3 hours: YouTube search costs ~500 quota units a run (free limit 10,000/day)

  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: radar-refresh, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Sync contract data from Contract Radar (keeps the committed copy if the fetch fails)
        run: |
          for f in data.js logos.js roles-kr.js regions.js; do
            curl -fsSL "https://set0panda.github.io/contract-radar/$f" -o "docs/contract/$f.new" && mv "docs/contract/$f.new" "docs/contract/$f" || { rm -f "docs/contract/$f.new"; echo "keeping existing $f"; }
          done
      - run: python radar.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SHEEP_PROXY_URL: ${{ secrets.SHEEP_PROXY_URL }}
          SHEEP_PROXY_TOKEN: ${{ secrets.SHEEP_PROXY_TOKEN }}
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar.db docs/data.js docs/contract
          git diff --cached --quiet || (git commit -m "Refresh data" && git pull --rebase -X theirs origin main && git push)
