name: Refresh radar (full)
on:
  schedule: [{cron: "7 */3 * * *"}]   # every 3 hours: YouTube search costs ~500 quota units a run (free limit 10,000/day)

  workflow_dispatch:
    inputs:
      force:
        description: 'Accept a large per-region change in the contract data that the guard would otherwise block'
        type: boolean
        default: false
permissions: {contents: write}
concurrency: {group: radar-refresh, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: "Sync contract data from Contract Radar (guarded - a suspicious snapshot is rejected and the last good copy stays)"
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.force && '1' || '0' }}
        run: |
          for f in data.js history.js logos.js roles-kr.js regions.js; do
            curl -fsSL "https://set0panda.github.io/contract-radar/$f" -o "docs/contract/$f.new" || { rm -f "docs/contract/$f.new"; echo "::warning::fetch failed for $f, keeping existing"; continue; }
            if [ "$f" = data.js ]; then
              rc=0; python scripts/guard_contract.py "docs/contract/$f" "docs/contract/$f.new" > /tmp/guard.txt || rc=$?
              cat /tmp/guard.txt; cat /tmp/guard.txt >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${rc:-0}" != 0 ]; then
              echo "::warning::contract data.js rejected by the guard, keeping existing (tick 'force' when re-running if the change is real)"; rm -f "docs/contract/$f.new"; continue
            fi
            mv "docs/contract/$f.new" "docs/contract/$f"
          done
      - run: python radar.py run
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          python scripts/bump_assets.py
          git add data/radar.db docs/data.js docs/contract docs/index.html
          git diff --cached --quiet || (git commit -m "Refresh data" && git pull --rebase -X theirs origin main && git push)
