name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="LoLTransferRadar/1.0 (+https://github.com/Set0Panda/LoLTransferDataDashboard)"
          for l in lec lck lcs; do curl -sL -m 30 -A "$UA" -o $l.html https://rostermania.lol/$l/transfers; sleep 3; done
          python3 - <<'PY'
          import re,collections
          for l in ['lec','lck','lcs']:
              s=open(l+'.html',encoding='utf-8',errors='replace').read()
              codes=collections.Counter(re.findall(r'<span class="max-w-\[18ch\] truncate">([^<]*)</span>',s))
              print(l,len(s),dict(codes))
              dates=re.findall(r'text-label-uppercase font-bold text-ink uppercase">([^<]*)</span>',s); print(' dates',dates[:3],len(dates))
              b=collections.Counter(re.findall(r'<span class="skew-x-6">([^<]*)</span>',s)); print(' badges',dict(b))
          s=open('lcs.html',encoding='utf-8',errors='replace').read()
          i=s.find('(renewal)'); print('RENEWAL:',re.sub(r'\s+',' ',s[i-900:i+700]) if i>=0 else 'none')
          s=open('lec.html',encoding='utf-8',errors='replace').read()
          i=s.find('out of league'); print('OUT:',re.sub(r'\s+',' ',s[i-800:i+500]) if i>=0 else 'none')
          PY
