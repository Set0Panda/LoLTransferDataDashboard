name: probe-leaguepedia
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cargo schema (slow, retrying)
        run: |
          UA="LoLTransferRadar/1.0 (https://github.com/Set0Panda/LoLTransferDataDashboard)"
          B="https://lol.fandom.com/api.php"
          q() { for n in 1 2 3 4 5 6; do out=$(curl -sS -m 40 -A "$UA" -G "$B" "$@"); case "$out" in *ratelimited*) sleep 30;; *) echo "$out" | head -c ${LIM:-2500}; echo; return;; esac; done; echo "still ratelimited"; }
          echo "== tables"; LIM=3000 q --data-urlencode action=cargotables --data-urlencode format=json
          sleep 10; echo "== RosterChanges fields"; q --data-urlencode action=cargofields --data-urlencode table=RosterChanges --data-urlencode format=json
          sleep 10; echo "== coach changes sample"; q --data-urlencode action=cargoquery --data-urlencode tables=RosterChanges --data-urlencode "fields=Date_Sort,Player,Direction,Team,Roles,Role_Display" --data-urlencode "where=Roles LIKE '%Coach%' AND Team='T1'" --data-urlencode "order_by=Date_Sort DESC" --data-urlencode limit=8 --data-urlencode format=json
