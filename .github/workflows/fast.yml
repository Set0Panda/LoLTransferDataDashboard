name: Fast news check
on:
  schedule: [{cron: "*/10 * * * *"}]   # GitHub's minimum is 5 min and it often runs late; 10 is realistic
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: radar-refresh, cancel-in-progress: false}   # never overlap the full refresh: they share the database
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python radar.py run --fast
      - name: Commit only if a new item appeared
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data.js
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git add data/radar.db
          git commit -m "New items"
          git pull --rebase -X theirs origin main && git push
